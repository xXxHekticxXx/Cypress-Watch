name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Cypress-Watch.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cypress Watch 1.0.${{ github.run_number }}
          body: |
            Install **Cypress-Watch.apk** on your phone (allow installing from your browser/Files app if Android asks).
            Each new version installs over the old one and keeps your data.
          files: Cypress-Watch.apk
          make_latest: true
